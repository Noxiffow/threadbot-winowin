app = "threadbot-n8n"
primary_region = "cdg"

[build]
  image = "n8nio/n8n:latest"

[http_service]
  internal_port = 5678
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "n8n_data"
  destination = "/home/node/.n8n"
